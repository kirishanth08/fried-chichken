<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none" class="crispster-brand-logo">
  <defs>
    <linearGradient id="crispGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD400"/>
      <stop offset="50%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FF5F00"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF5F00"/>
      <stop offset="70%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FFD400"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF5F00" flood-opacity="0.3"/>
    </filter>
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Logo Mark: Crunchy Chicken Drumstick Icon Badge -->
  <g transform="translate(6, 5)">
    <!-- Badge Background Circle -->
    <rect x="0" y="0" width="58" height="58" rx="16" fill="#18181B" stroke="url(#crispGrad)" stroke-width="2.5" />
    
    <!-- Crunch Sparkles / Fire Accents -->
    <path d="M44 10 L46 6 L48 10 L52 12 L48 14 L46 18 L44 14 L40 12 Z" fill="#FFD400" />
    <circle cx="12" cy="14" r="2" fill="#FF8C00" />
    <circle cx="48" cy="46" r="1.5" fill="#FFC300" />

    <!-- Crispy Drumstick Silhouette -->
    <g transform="translate(8, 7) scale(0.85)">
      <!-- Crispy drumstick meaty head -->
      <path d="M30 6 C42 8, 48 20, 42 32 C38 40, 28 43, 20 37 C15 33, 16 23, 19 16 C22 9, 25 5, 30 6 Z" 
            fill="url(#fireGrad)" filter="url(#glow)"/>
      <!-- Crunchy texture bumps -->
      <circle cx="34" cy="16" r="3.5" fill="#FFD400" opacity="0.9" />
      <circle cx="26" cy="24" r="2.8" fill="#FFD400" opacity="0.8" />
      <circle cx="37" cy="26" r="3" fill="#FF5F00" />
      <circle cx="28" cy="14" r="2" fill="#FFFFFF" opacity="0.6" />
      <!-- Bone knuckle -->
      <path d="M19 36 L11 44 C8 47, 5 44, 7 41 L10 37 C8 34, 11 31, 14 33 L18 36 Z" 
            fill="#F4F4F5" stroke="#D4D4D8" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="7" cy="45" r="3" fill="#F4F4F5"/>
      <circle cx="10" cy="48" r="3" fill="#F4F4F5"/>
    </g>
  </g>

  <!-- Typography: Universal High-Contrast Brand Wordmark (Consistent in ALL Modes) -->
  <g transform="translate(74, 15)" filter="url(#crispShadow)">
    <!-- Under-shadow silhouette contour for flawless contrast on both light and dark backgrounds -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Bebas Neue', 'Segoe UI', Impact, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="#121216" stroke="#121216" stroke-width="3" stroke-linejoin="round">
      CRISP<tspan>S</tspan><tspan>T</tspan><tspan>ER</tspan>
    </text>

    <!-- Brand Wordmark: Identical White CRISP + Fiery Gradient STER Across All Modes -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Bebas Neue', 'Segoe UI', Impact, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="#FFFFFF" class="crispster-text-main">
      CRISP<tspan fill="#FF5F00">S</tspan><tspan fill="#FF8C00">T</tspan><tspan fill="#FFD400">ER</tspan>
    </text>

    <!-- Flame Accent on the dot of I or over the S -->
    <path d="M38 4 C40 1, 43 0, 41 -4 C44 -1, 46 3, 44 6 C42 8, 39 7, 38 4 Z" fill="#FF5F00" stroke="#121216" stroke-width="1" />

    <!-- Subtitle / Tagline -->
    <text x="2" y="47" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="9.5" letter-spacing="3.8" fill="#FF8C00" stroke="#121216" stroke-width="0.8" paint-order="stroke fill">
      PREMIUM FRIED CHICKEN
    </text>
  </g>
</svg>
